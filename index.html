<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Subscribe</title>
<style>
  html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif}
  .center{height:100%;display:flex;align-items:center;justify-content:center}
  .card{ margin-top: 5rem;}
  input[type="email"]{padding:.6rem;font-size:1rem;width:22rem}
  button{padding:.6rem 1rem;font-size:1rem;cursor:pointer;margin-top:.6rem}
  .hp {position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;}
  #msg{margin-top:.6rem;font-size:.92rem}
</style>
</head>
<body>
  <div class="center">
    <div style="display:flex; flex-direction:column;">

      <div style="display:flex;flex-direction:flex-row;align-items: center;">
         <img src="./plato.svg" height="500" width="500" alt="Logo" class="logo" />
        <div style="font-style: italic;"> ~ Necessity is the mother of all invention </div>
      </div>

      <div class="card">
        <form id="f" onsubmit="return false;">
          <div style="display:flex;flex-direction:column;gap:.5rem;align-items:center">
            <input id="email" type="email" placeholder="you@example.com" required />
            <!-- honeypot: visible in DOM but off-screen for humans -->
            <input id="hp" name="honeypot" class="hp" autocomplete="off" tabindex="-1" />
            <!-- timestamp (seconds) -->
            <input id="ts" name="ts" type="hidden" />
            <!-- OPTIONAL: add a container for reCAPTCHA if you want -->
            <!-- <div class="g-recaptcha" data-sitekey="YOUR_SITE_KEY"></div> -->
            <button id="btn">Subscribe</button>
            <div id="msg"></div>
          </div>
        </form>
      </div>
    </div>
  </div>

<script>
  // Your deployment URL
  const endpoint = "https://script.google.com/macros/s/AKfycbzmvTESuXG_me16XkDjV9SHNXplD-EeTz0Fh_JUwOBH28Q45-btqvdJoroNytRpISzx/exec";

  const form = document.getElementById('f');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  const emailInput = document.getElementById('email');
  const tsInput = document.getElementById('ts');

  // 1. Set Timestamp on page load
  // We store it in a variable or ensure the input is set
  const sessionStart = Math.floor(Date.now() / 1000);
  tsInput.value = sessionStart;

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    msg.textContent = "Sending...";
    msg.style.color = "#666"; // Reset color
    btn.disabled = true;

    const email = emailInput.value.trim();
    const honeypot = document.getElementById('hp').value.trim();
    
    // Ensure ts is sent. If the DOM lost it, use the variable.
    const ts = tsInput.value || sessionStart;

    if (!email) {
      msg.textContent = "Enter an email";
      btn.disabled = false;
      return;
    }

    // Basic client-side email regex
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msg.textContent = "Invalid email address";
      btn.disabled = false;
      return;
    }

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        redirect: 'follow',
        // text/plain allows us to bypass CORS preflight checks
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ email, honeypot, ts })
      });

      const j = await res.json();

      if (j.success) {
        msg.textContent = "Thanks :) appreciate you wanting to be kept updated!";
        msg.style.color = "green";
        // Only clear the email, do NOT reset the timestamp
        emailInput.value = ""; 
      } else {
        msg.textContent = "Error: " + j.error;
        msg.style.color = "red";
      }

    } catch (err) {
      console.error(err);
      msg.textContent = "Network error, please try again.";
      msg.style.color = "red";
    } finally {
      btn.disabled = false;
    }
  });

  // Handle Enter key
  emailInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') {
      e.preventDefault(); // Prevent default form submit behavior
      form.dispatchEvent(new Event('submit'));
    }
  });
</script>

<!-- OPTIONAL: include reCAPTCHA script if you plan to use it client-side -->
<!-- <script src="https://www.google.com/recaptcha/api.js" async defer></script> -->

</body>
</html>
